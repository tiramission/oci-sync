name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Verify before packaging
        run: |
          # A tag is the one push nobody reviews, so the checks that normally
          # live in CI have to run here or not at all. mygo vet is the only
          # thing that catches a native UI build value outliving its frame,
          # and the TUI tests are run under both locale widths because the
          # layout answers differently depending on which one is set.
          go vet ./...
          go tool mygo vet .
          RUNEWIDTH_EASTASIAN=0 go test -count=1 ./...
          RUNEWIDTH_EASTASIAN=1 go test -count=1 ./...

      - name: Determine version
        id: version
        run: |
          TAG=${GITHUB_REF##*/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          # steps.version.outputs.version is the tag with the leading v
          # already stripped, so the binary reports "0.8.0" rather than
          # "v0.8.0". That string is also written into the io.oci-sync.version
          # annotation, so the prefix would follow the artifact into every
          # registry it is pushed to. Overwriting it with TAG here undid the
          # strip step and shipped the prefix in eight releases.
          VERSION=${{ steps.version.outputs.version }}
          for OS in linux darwin windows; do
            for ARCH in amd64 arm64; do
              EXT=""
              if [ "$OS" = "windows" ]; then EXT=".exe"; fi
              OUTPUT="oci-sync-${OS}-${ARCH}${EXT}"
              GOOS=$OS GOARCH=$ARCH go build -ldflags "-X github.com/tiramission/oci-sync/internal/version.Version=${VERSION}" -o "$OUTPUT" .
            done
          done

      - name: Check the version the binary reports
        run: |
          # The build is the only place the ldflags path gets exercised, so a
          # mistyped -X would otherwise ship as a release nobody notices until
          # a registry compares annotations.
          got=$(./oci-sync-linux-amd64 --version | awk '{print $NF}')
          if [ "$got" != "${{ steps.version.outputs.version }}" ]; then
            echo "binary reports $got, expected ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Determine if prerelease
        id: prerelease
        run: |
          TAG=${GITHUB_REF##*/}
          if [[ $TAG =~ -alpha|-beta|-rc ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            oci-sync-linux-amd64
            oci-sync-linux-arm64
            oci-sync-darwin-amd64
            oci-sync-darwin-arm64
            oci-sync-windows-amd64.exe
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
